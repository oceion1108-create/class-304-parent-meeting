<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>撖思??? ??銝僑?</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Segoe UI', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif;
  background: linear-gradient(135deg, #0d1117 0%, #1a1a2e 100%);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  color: #fff;
}
.card {
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 20px;
  padding: 32px 24px;
  max-width: 380px;
  width: 100%;
  text-align: center;
  backdrop-filter: blur(8px);
}
h1 {
  font-size: 1.4em;
  font-weight: 700;
  color: #4fc3f7;
  margin-bottom: 6px;
}
.sub {
  font-size: 0.9em;
  color: #888;
  margin-bottom: 20px;
}
input {
  width: 100%;
  padding: 14px 16px;
  border-radius: 12px;
  border: 1px solid rgba(79,195,247,0.3);
  background: rgba(255,255,255,0.08);
  color: #fff;
  font-size: 16px;
  font-family: inherit;
  outline: none;
  transition: border-color 0.2s;
  box-sizing: border-box;
}
input:focus { border-color: #4fc3f7; }
button {
  width: 100%;
  margin-top: 12px;
  padding: 14px;
  background: #4fc3f7;
  color: #0d1117;
  border: none;
  border-radius: 12px;
  font-weight: 700;
  font-size: 16px;
  cursor: pointer;
  transition: opacity 0.2s;
}
button:disabled { opacity: 0.4; cursor: default; }
button:not(:disabled):hover { opacity: 0.85; }
.msg {
  margin-top: 16px;
  font-size: 0.85em;
  color: #81c784;
  min-height: 1.4em;
}
.footer {
  margin-top: 20px;
  font-size: 0.75em;
  color: #555;
}
.emoji { font-size: 2.5em; margin-bottom: 12px; }
</style>
</head>
<body>
<div class="card">
  <div class="emoji">??</div>
  <h1>撖思??函???</h1>
  <p class="sub">銝僑? ?剛扛??/p>
  <input id="wc-input" type="text" placeholder="頛詨撠酋摮??迂??蝳? maxlength="20" />
  <button id="wc-btn">?蟡? ??/button>
  <div class="msg" id="wc-msg"></div>
  <div class="footer">? ?敺??單?憿舐內?冽?摰方撟?</div>
</div>

<script>
const API_BASE = '__API_SERVER__';
const IS_LOCAL = !API_BASE.startsWith('__');
const API = (IS_LOCAL ? API_BASE : window.location.origin) + '/api/words';

const input = document.getElementById('wc-input');
const btn = document.getElementById('wc-btn');
const msg = document.getElementById('wc-msg');

if (!IS_LOCAL) {
  input.disabled = true;
  btn.disabled = true;
  msg.textContent = '? 隢??啁閬芣??曉 Wi-Fi 雿輻甇文???;
  msg.style.color = '#ffb74d';
}

async function handleSubmit() {
  const word = input.value.trim();
  if (!word) return;
  btn.disabled = true;
  try {
    const r = await fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ word })
    });
    if (r.ok) {
      msg.textContent = '??撌脤嚗?雓??蝳???';
      input.value = '';
    } else {
      msg.textContent = '???憭望?嚗??岫銝甈?;
    }
  } catch (_) {
    msg.textContent = '??蝬脰楝?航炊嚗?瑼Ｘ???';
  } finally {
    btn.disabled = false;
    setTimeout(() => { msg.textContent = ''; }, 3000);
  }
}

btn.addEventListener('click', handleSubmit);
input.addEventListener('keypress', e => { if (e.key === 'Enter') handleSubmit(); });
input.focus();
</script>
</body>
</html>
